  <g fill="#1a1a1a">
    <!-- Mortarboard: flat board + button + tassel -->
    <path d="M32 9 L53 18 L32 27 L11 18 Z"/>
    <path d="M18 22 v7 c0 4 6.5 6.5 14 6.5 s14 -2.5 14 -6.5 v-7 l-14 6 Z" opacity="0.92"/>
    <path d="M53 18 v10" stroke="#1a1a1a" stroke-width="1.6" fill="none"/>
    <circle cx="53" cy="29.5" r="2.2"/>
    <!-- Open book below -->
    <path d="M32 40 C26 36 17 36 11 38 v15 c6 -2 15 -2 21 2 Z"/>
    <path d="M32 40 C38 36 47 36 53 38 v15 c-6 -2 -15 -2 -21 2 Z"/>
